<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stroop | Avaliação e Intervenção Neurocognitiva</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#263248;background:#f6f8fc}*{box-sizing:border-box}body{margin:0}header{background:#fff;border-bottom:1px solid #e4e8ef;padding:20px max(18px,calc((100vw - 1050px)/2))}h1{margin:0;font-size:24px}header p{margin:5px 0;color:#64748b}main{max-width:1050px;margin:24px auto;padding:0 16px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}button,input,select{font:inherit}button{border:0;border-radius:12px;padding:12px 17px;background:#e9edf6;color:#293c59;cursor:pointer;font-weight:650}button.primary{background:#4269b1;color:white}button:disabled{opacity:.5;cursor:not-allowed}.tabs button.active{background:#4269b1;color:#fff}.panel{background:#fff;border:1px solid #e3e8f1;border-radius:18px;padding:22px;box-shadow:0 6px 22px #23344c0a;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}label{display:block;font-size:13px;color:#526178;font-weight:650;margin-bottom:5px}input,select{width:100%;padding:11px;border:1px solid #cdd5e2;border-radius:10px;background:white;color:#263248}h2{margin:0 0 14px;font-size:20px}h3{margin:0 0 8px}.muted{color:#69768b;font-size:14px;line-height:1.5}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.stimulus{height:265px;border:2px solid #e5e9f1;border-radius:18px;display:flex;align-items:center;justify-content:center;margin:16px 0;background:#fff}.word{font-size:clamp(38px,9vw,76px);font-weight:800;letter-spacing:1px}.circle{width:125px;height:125px;border-radius:50%}.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#526178;font-size:14px}.response{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.response button{min-height:52px}.response .correct{background:#d7f2e5;color:#155c3c}.response .wrong{background:#ffe3e3;color:#8b2424}.warning{border-left:4px solid #dca85c;padding:12px 14px;background:#fff8ed;color:#765b31;border-radius:8px}.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.metric{padding:14px;border-radius:12px;background:#f1f5fb}.metric strong{display:block;font-size:25px;margin-top:6px}.tablewrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:11px;border-bottom:1px solid #e8edf4;text-align:left}th{color:#526178}footer{text-align:center;color:#758197;font-size:12px;padding:25px}#toast{color:#285f4a;margin-top:8px}.small{font-size:12px}.hidden{display:none}@media print{header,.tabs,.noprint,footer{display:none!important}main{margin:0;max-width:none}.panel{box-shadow:none;border:0;padding:5px}body{background:white}}
.syll-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:18px 0}.syll-cell{text-align:center;font-weight:750;font-size:clamp(22px,4vw,34px);padding:12px 3px;background:#f4f7fc;border-radius:10px}.syll-cell.done{background:#d7f2e5}.syll-cell.current{outline:3px solid #4269b1}.bigmath{font-size:clamp(40px,9vw,75px);font-weight:750;text-align:center;padding:55px 0}.counter{font-size:28px;font-weight:750;color:#4269b1}@media(max-width:450px){.syll-grid{gap:5px}.syll-cell{padding:9px 0}}
</style></head><body><header><h1>Stroop <span style="color:#6384c6">| Avaliação e Intervenção</span></h1><p>Ferramenta psicopedagógica independente · indicadores descritivos, sem normas clínicas</p></header><main><nav class="tabs noprint"><button data-tab="inicio" class="active">Início</button><button data-tab="avaliacao">Avaliação</button><button data-tab="intervencao">Intervenção</button><button data-tab="silabas">NRA · Sílabas</button><button data-tab="matematica">Matemática</button><button data-tab="historico">Histórico</button></nav><section id="view"></section></main><footer>Os resultados não substituem instrumentos validados nem estabelecem diagnóstico. Dados salvos apenas neste navegador.</footer><script>
const colors=[{name:'AMARELO',hex:'#d6a000'},{name:'AZUL',hex:'#1764c0'},{name:'VERDE',hex:'#20864a'},{name:'VERMELHO',hex:'#d02b3b'}];const $=s=>document.querySelector(s);const escapeHTML=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const shuffle=a=>{let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};const fmt=n=>(n/1000).toFixed(2)+' s';let tab='inicio',session=null,records=JSON.parse(localStorage.getItem('stroop_records_v1')||'[]');const save=()=>localStorage.setItem('stroop_records_v1',JSON.stringify(records));function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(session){if(session.extra){renderExtraTask();return}renderTask();return}if(tab==='inicio')$('#view').innerHTML=`<div class="panel"><h2>Bem-vindo ao Stroop</h2><p>Escolha a modalidade. A avaliação registra o desempenho em três condições; a intervenção oferece tarefas graduadas e feedback.</p><div class="grid"><div class="panel"><h3>Avaliação descritiva</h3><p class="muted">24 estímulos por condição, respostas orais registradas pelo aplicador e análise dos tempos e erros.</p><button class="primary" onclick="go('avaliacao')">Iniciar configuração</button></div><div class="panel"><h3>Intervenção neurocognitiva</h3><p class="muted">Níveis de dificuldade e atividades de controle inibitório, com feedback imediato.</p><button class="primary" onclick="go('intervencao')">Configurar treino</button></div></div><div class="warning">A aplicação deve ser supervisionada. O registro manual da resposta oral evita tratar reconhecimento automático de voz como medida validada. A diferença entre condições é apenas descritiva, não uma pontuação normativa.</div></div>`;else if(tab==='avaliacao'||tab==='intervencao')renderConfig();else if(tab==='silabas'||tab==='matematica')renderExtraConfig();else renderHistory()}
function go(t){tab=t;render()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{if(session&&!confirm('Encerrar a sessão atual sem salvar?'))return;session=null;go(b.dataset.tab)});
function renderConfig(){$('#view').innerHTML=`<div class="panel"><h2>${tab==='avaliacao'?'Configurar avaliação':'Configurar intervenção'}</h2><div class="grid"><div><label>Identificação do aluno (use código ou iniciais)</label><input id="student" maxlength="70" placeholder="Ex.: Aluno A"></div><div><label>Idade (opcional)</label><input id="age" type="number" min="1" max="110" placeholder="Anos"></div>${tab==='intervencao'?`<div><label>Nível</label><select id="level"><option value="1">1 · Nomeação de cores</option><option value="2">2 · Palavras incongruentes</option><option value="3">3 · Alternância de regras</option></select></div><div><label>Quantidade de estímulos</label><select id="count"><option>8</option><option selected>12</option><option>24</option></select></div>`:''}</div><p class="muted">${tab==='avaliacao'?'Ordem: leitura de palavras, nomeação de cores e condição incongruente. Cada etapa contém 24 itens.':'O aplicador registra a resposta oral em cada tentativa. No nível 3, a regra alterna entre ler a palavra e nomear a cor da fonte.'}</p><div class="actions"><button class="primary" onclick="start()">Começar</button></div></div>`}
function makeItems(mode,level,count){let n=mode==='avaliacao'?24:count;let phases=mode==='avaliacao'?['leitura','cores','incongruente']:[level===1?'cores':level===2?'incongruente':'alternancia'];return phases.map((phase,pi)=>({phase,items:Array.from({length:n},(_,i)=>{let c=colors[i%4],word=colors[(i+1+Math.floor(i/4))%4];if(phase==='leitura')return{word:c.name,ink:'#171d2a',answer:c.name};if(phase==='cores')return{circle:true,ink:c.hex,answer:c.name};let read=phase==='alternancia'&&i%2===1;return{word:word.name,ink:c.hex,answer:read?word.name:c.name,rule:read?'LEIA A PALAVRA':'DIGA A COR DA FONTE'}})}))}
function start(){let student=$('#student').value.trim();if(!student){alert('Informe um código ou identificação do aluno.');return}let age=$('#age').value,mode=tab,level=mode==='intervencao'?Number($('#level').value):null,count=mode==='intervencao'?Number($('#count').value):24;session={id:Date.now(),student,age,mode,level,phases:makeItems(mode,level,count),phaseIndex:0,index:0,answers:[],began:Date.now(),phaseStart:Date.now(),itemStart:Date.now(),paused:false};renderTask()}
function current(){return session.phases[session.phaseIndex]}function renderTask(){let p=current(),item=p.items[session.index];let n=session.answers.filter(a=>a.phase===p.phase).length;let isTraining=session.mode==='intervencao';$('#view').innerHTML=`<div class="panel"><div class="status"><strong>${session.mode==='avaliacao'?'Avaliação':'Intervenção'} · ${phaseName(p.phase)}</strong><span>Etapa ${session.phaseIndex+1}/${session.phases.length} · Item ${session.index+1}/${p.items.length}</span></div><p class="muted">${p.phase==='leitura'?'Peça ao aluno que leia a palavra.':p.phase==='cores'?'Peça ao aluno que diga a cor do círculo.':p.phase==='alternancia'?'Siga a regra indicada em cada tentativa.':'Peça ao aluno que diga a COR DA FONTE, não a palavra.'}</p>${item.rule?`<h3 style="text-align:center;color:#4269b1">${item.rule}</h3>`:''}<div class="stimulus">${item.circle?`<div class="circle" style="background:${item.ink}"></div>`:`<div class="word" style="color:${item.ink}">${item.word}</div>`}</div><p class="muted">Resposta esperada (aplicador): <strong>${item.answer}</strong>. Marque a resposta oral observada.</p><div class="response"><button class="correct" onclick="respond('acerto')">Acerto</button><button class="wrong" onclick="respond('erro')">Erro</button><button onclick="respond('autocorrecao')">Autocorreção</button><button onclick="respond('omissao')">Omissão</button></div><div class="actions noprint"><button onclick="pause()">${session.paused?'Retomar':'Pausar'}</button><button onclick="finish(true)">Encerrar e salvar parcial</button></div><p class="small muted">Itens concluídos nesta etapa: ${n}. Tempo medido até o registro pelo aplicador, incluindo sua latência de marcação.</p>${session.paused?'<div class="warning">Sessão pausada. Retome para registrar respostas.</div>':''}${isTraining?'<p class="small muted">Treino: feedback de desempenho após cada resposta.</p>':''}</div>`;document.querySelectorAll('.response button').forEach(b=>b.disabled=session.paused)}
function renderExtraConfig(){let syll=tab==='silabas';$('#view').innerHTML=`<div class="panel"><h2>${syll?'Nomeação rápida de sílabas':'Matemática · quatro operações'}</h2><p class="muted">${syll?'Tarefa descritiva de nomeação oral de sílabas repetidas em grade, com registro manual de respostas e tempo. Não é um teste normatizado de NRA.':'Continhas básicas apresentadas individualmente, com registro pelo aplicador. Os níveis controlam a magnitude dos números e a complexidade das operações.'}</p><div class="grid"><div><label>Identificação do aluno</label><input id="student" maxlength="70" placeholder="Ex.: Aluno A"></div><div><label>Idade (opcional)</label><input id="age" type="number" min="1" max="110"></div><div><label>Modalidade</label><select id="extraMode"><option value="avaliacao">Avaliação descritiva</option><option value="treino">Intervenção / treino</option></select></div><div><label>Nível</label><select id="extraLevel">${syll?'<option value="1">1 · Sílabas CV simples</option><option value="2">2 · Sílabas variadas (CV, V, VC)</option><option value="3">3 · Sílabas complexas</option>':'<option value="1">1 · Números pequenos</option><option value="2">2 · Números intermediários</option><option value="3">3 · Números maiores</option>'}</select></div><div><label>Quantidade de itens</label><select id="extraCount"><option value="10">10</option><option value="20" selected>20</option><option value="40">40</option></select></div>${syll?'':`<div><label>Operação</label><select id="operation"><option value="mista">Mista · quatro operações</option><option value="+">Adição</option><option value="−">Subtração</option><option value="×">Multiplicação</option><option value="÷">Divisão</option></select></div>`}</div><div class="actions"><button class="primary" onclick="startExtra()">Começar</button></div></div>`}
const syllSets={1:['PA','ME','TI','BO','LU'],2:['PA','EL','OS','MI','A','TRA','NU','IR'],3:['BRA','FRE','PLO','CRU','GRA','TRANS','PRIS','CLA']};
function makeMath(level,operation,n){let ops=operation==='mista'?['+','−','×','÷']:[operation];return Array.from({length:n},(_,i)=>{let op=ops[i%ops.length],a,b,answer;const rand=(min,max)=>min+Math.floor(Math.random()*(max-min+1));if(op==='+'){a=rand(1,level===1?9:level===2?49:199);b=rand(1,level===1?9:level===2?49:199);answer=a+b}else if(op==='−'){a=rand(1,level===1?10:level===2?99:299);b=rand(0,a);answer=a-b}else if(op==='×'){a=rand(1,level===1?5:level===2?10:12);b=rand(1,level===1?5:level===2?10:12);answer=a*b}else{b=rand(1,level===1?5:level===2?10:12);answer=rand(1,level===1?5:level===2?10:12);a=b*answer}return{display:`${a} ${op} ${b} = ?`,expected:String(answer),operation:op}})}
function startExtra(){let student=$('#student').value.trim();if(!student){alert('Informe a identificação do aluno.');return}let age=$('#age').value,level=Number($('#extraLevel').value),count=Number($('#extraCount').value),mode=$('#extraMode').value,kind=tab;let items=kind==='silabas'?shuffle(Array.from({length:count},(_,i)=>syllSets[level][i%syllSets[level].length])).map(v=>({display:v,expected:v})):shuffle(makeMath(level,$('#operation').value,count));session={extra:true,id:Date.now(),student,age,kind,mode,level,items,index:0,answers:[],began:Date.now(),itemStart:Date.now(),paused:false};renderExtraTask()}
function renderExtraTask(){let s=session,syll=s.kind==='silabas',item=s.items[s.index];$('#view').innerHTML=`<div class="panel"><div class="status"><strong>${syll?'NRA · Sílabas':'Matemática'} · ${s.mode==='avaliacao'?'Avaliação':'Treino'} · Nível ${s.level}</strong><span>Item ${s.index+1} de ${s.items.length}</span></div><p class="muted">${syll?'Peça ao aluno que nomeie as sílabas da esquerda para a direita, linha por linha. Registre cada resposta oral.':'Apresente a operação e registre a resposta observada. Permita estratégias ou recursos de apoio conforme o objetivo da sessão e registre-os nas observações.'}</p>${syll?`<div class="syll-grid">${s.items.map((v,i)=>`<div class="syll-cell ${i<s.index?'done':i===s.index?'current':''}">${escapeHTML(v.display)}</div>`).join('')}</div>`:`<div class="stimulus"><div class="bigmath">${escapeHTML(item.display)}</div></div>`}<p class="muted">Resposta esperada (aplicador): <strong>${escapeHTML(item.expected)}</strong></p><div class="response"><button class="correct" onclick="respondExtra('acerto')" ${s.paused?'disabled':''}>Acerto</button><button class="wrong" onclick="respondExtra('erro')" ${s.paused?'disabled':''}>Erro</button><button onclick="respondExtra('autocorrecao')" ${s.paused?'disabled':''}>Autocorreção</button><button onclick="respondExtra('omissao')" ${s.paused?'disabled':''}>Omissão</button></div><div class="actions noprint"><button onclick="pauseExtra()">${s.paused?'Retomar':'Pausar'}</button><button onclick="finishExtra(true)">Encerrar e salvar parcial</button></div><p class="small muted">O tempo inclui a latência de marcação pelo aplicador.${syll?' A grade permanece visível durante a tarefa.':''}</p>${s.paused?'<div class="warning">Sessão pausada.</div>':''}</div>`}
function respondExtra(result){let s=session;if(!s||s.paused)return;let now=Date.now(),item=s.items[s.index];s.answers.push({phase:s.kind==='silabas'?'nomeacao_silabas':'matematica',index:s.index+1,expected:item.expected,stimulus:item.display,result,latency:now-s.itemStart,operation:item.operation||''});s.index++;if(s.index>=s.items.length){finishExtra(false);return}s.itemStart=Date.now();renderExtraTask()}
function pauseExtra(){let s=session;if(!s)return;if(!s.paused){s.paused=true;s.pauseAt=Date.now()}else{s.itemStart+=Date.now()-s.pauseAt;s.paused=false}renderExtraTask()}
function finishExtra(partial){let s=session;if(!s)return;records.unshift({id:s.id,date:new Date().toISOString(),student:s.student,age:s.age,mode:s.mode==='avaliacao'?'avaliacao':'intervencao',kind:s.kind,level:s.level,partial,answers:s.answers});save();session=null;tab='historico';renderHistory(records[0].id)}
function phaseName(p){return({leitura:'Leitura de palavras',cores:'Nomeação de cores',incongruente:'Condição incongruente',alternancia:'Alternância de regras',nomeacao_silabas:'Nomeação de sílabas',matematica:'Operações matemáticas'})[p]};function respond(result){if(!session||session.paused)return;let now=Date.now(),p=current(),item=p.items[session.index];session.answers.push({phase:p.phase,index:session.index+1,expected:item.answer,result,latency:now-session.itemStart,rule:item.rule||''});session.index++;if(session.index>=p.items.length){session.phaseIndex++;session.index=0;if(session.phaseIndex>=session.phases.length){finish(false);return}alert('Etapa concluída. Próxima: '+phaseName(current().phase));session.phaseStart=Date.now()}session.itemStart=Date.now();renderTask()}
function pause(){if(!session)return;if(!session.paused){session.paused=true;session.pauseAt=Date.now()}else{let delta=Date.now()-session.pauseAt;session.itemStart+=delta;session.paused=false}renderTask()}
function finish(partial){if(!session)return;let s=session;let record={id:s.id,date:new Date().toISOString(),student:s.student,age:s.age,mode:s.mode,level:s.level,partial,answers:s.answers};records.unshift(record);save();session=null;tab='historico';renderHistory(record.id)}
function stats(r){let phases=[...new Set(r.answers.map(a=>a.phase))];return phases.map(phase=>{let a=r.answers.filter(x=>x.phase===phase);return{phase,n:a.length,correct:a.filter(x=>x.result==='acerto').length,errors:a.filter(x=>x.result==='erro').length,self:a.filter(x=>x.result==='autocorrecao').length,omissions:a.filter(x=>x.result==='omissao').length,total:a.reduce((v,x)=>v+x.latency,0)}})}function renderHistory(openId){let selected=records.find(x=>x.id===openId);$('#view').innerHTML=`<div class="panel"><h2>Histórico de sessões</h2>${records.length?`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Aluno</th><th>Modalidade</th><th>Itens</th><th>Ação</th></tr></thead><tbody>${records.map(r=>`<tr><td>${new Date(r.date).toLocaleString('pt-BR')}</td><td>${escapeHTML(r.student)}</td><td>${r.kind==='silabas'?'Sílabas · ':r.kind==='matematica'?'Matemática · ':''}${r.mode==='avaliacao'?'Avaliação':'Intervenção'}${r.partial?' (parcial)':''}</td><td>${r.answers.length}</td><td><button onclick="renderHistory(${r.id})">Ver relatório</button></td></tr>`).join('')}</tbody></table></div>`:'<p class="muted">Nenhuma sessão registrada neste navegador.</p>'}<div class="actions noprint"><button onclick="exportCSV()">Exportar CSV</button><button onclick="clearHistory()">Apagar histórico local</button></div></div>${selected?reportHTML(selected):''}`}
function reportHTML(r){let ss=stats(r),read=ss.find(x=>x.phase==='leitura'),col=ss.find(x=>x.phase==='cores'),inc=ss.find(x=>x.phase==='incongruente');let delta=inc&&col?(inc.total/inc.n-col.total/col.n):null;return `<div class="panel" id="report"><h2>Relatório descritivo · ${r.kind==='silabas'?'Nomeação de sílabas':r.kind==='matematica'?'Matemática':'Stroop'}</h2><p><strong>Aluno:</strong> ${escapeHTML(r.student)} · <strong>Idade:</strong> ${escapeHTML(r.age||'Não informada')} · <strong>Data:</strong> ${new Date(r.date).toLocaleString('pt-BR')}</p><p><strong>Modalidade:</strong> ${r.kind==='silabas'?'Nomeação de sílabas · ':r.kind==='matematica'?'Matemática · ':''}${r.mode==='avaliacao'?'Avaliação descritiva':'Intervenção · nível '+r.level} ${r.partial?'· sessão parcial':''}</p><div class="tablewrap"><table><thead><tr><th>Condição</th><th>Itens</th><th>Acertos</th><th>Erros</th><th>Autocorreções</th><th>Omissões</th><th>Tempo total</th></tr></thead><tbody>${ss.map(s=>`<tr><td>${phaseName(s.phase)}</td><td>${s.n}</td><td>${s.correct}</td><td>${s.errors}</td><td>${s.self}</td><td>${s.omissions}</td><td>${fmt(s.total)}</td></tr>`).join('')}</tbody></table></div>${delta!==null?`<p><strong>Diferença descritiva de tempo médio por item:</strong> ${delta>=0?'+':''}${fmt(delta)} (incongruente − nomeação de cores). Não corresponde a escore padronizado de interferência.</p>`:''}<p class="muted">${r.kind==='silabas'?'Tarefa experimental de nomeação de sílabas, sem normas de NRA. ':r.kind==='matematica'?'Tarefa de desempenho aritmético sem normas padronizadas. ':''}Tempos incluem o intervalo entre exibição do estímulo e marcação pelo aplicador. Interprete com cautela, considerando leitura, linguagem, reconhecimento de cores, atenção, familiaridade e condições de aplicação. Não há normas, percentis ou pontos de corte.</p><div class="actions noprint"><button class="primary" onclick="window.print()">Imprimir / salvar em PDF</button><button onclick="downloadRecord(${r.id})">Baixar dados JSON</button><button onclick="renderHistory()">Fechar relatório</button></div></div>`}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function downloadRecord(id){let r=records.find(x=>x.id===id);if(r)download('stroop-sessao-'+id+'.json',JSON.stringify(r,null,2),'application/json')}function exportCSV(){let rows=[['data','aluno','modalidade','fase','item','resposta_esperada','resultado','latencia_ms','estimulo','operacao'],...records.flatMap(r=>r.answers.map(a=>[r.date,r.student,r.mode,a.phase,a.index,a.expected,a.result,a.latency,a.stimulus||'',a.operation||'']))];download('stroop-registros.csv','\ufeff'+rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n'),'text/csv;charset=utf-8')}function clearHistory(){if(confirm('Apagar definitivamente todos os registros deste navegador?')){records=[];save();renderHistory()}}render();
</script></body></html>
